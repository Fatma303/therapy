<html>
<head>
  <title>صفحة تسجيل الدخول</title>
  <style>
  * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body, html {
  height: 100%;
}

.login-container {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100%;
background-color: rgb(13, 13, 49);
}

.login-box {
  background: rgba(255, 255, 255, 0.8);
  padding: 30px;
  border-radius: 10px;
  width: 300px;
  text-align: center;
}

h2 {
  margin-bottom: 20px;
  font-family: Arial, sans-serif;
}

.textbox {
  margin-bottom: 20px;
}

.textbox input {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
  border: 1px solid #ddd;
  border-radius: 5px;
}

input[type="submit"] {
  background-color: #4CAF50;
  color: white;
  border: none;
  padding: 10px;
  width: 100%;
  border-radius: 5px;
  cursor: pointer;
}

input[type="submit"]:hover {
  background-color: #45a049;
}
</style>
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <h2>تسجيل الدخول</h2>
      <form action="https://fatma303.github.io/therapy/" method="get">
        <div class="textbox">
          <input type="text" placeholder="اسم المستخدم" name="username" required>
        </div>
        <div class="textbox">
          <input type="password" placeholder="كلمة المرور" name="password" required>
        </div>
        <input type="submit" value="دخول">
      </form>
    </div>
  </div>
</body>
</html>
